<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="100%" height="100%">
  <defs>
    <linearGradient id="isoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005a9c"/>
      <stop offset="100%" stop-color="#002f6c"/>
    </linearGradient>
  </defs>
  <!-- Globe / Crest graphic -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#isoBlue)" stroke-width="4"/>
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#isoBlue)" stroke-width="2.5" stroke-dasharray="2 1"/>
  <line x1="50" y1="12" x2="50" y2="88" stroke="url(#isoBlue)" stroke-width="2.5"/>
  <line x1="12" y1="50" x2="88" y2="50" stroke="url(#isoBlue)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="22" fill="#ffffff" stroke="url(#isoBlue)" stroke-width="3"/>
  <text x="50" y="55" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="900" fill="#003366" text-anchor="middle">ISO</text>
  
  <!-- Right text -->
  <text x="96" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="900" fill="#002f6c" letter-spacing="-0.5">ISO 9001</text>
  <text x="96" y="60" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#df8b1a" letter-spacing="1.5">: 2015</text>
  <rect x="96" y="68" width="94" height="18" rx="4" fill="#002f6c"/>
  <text x="143" y="81" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CERTIFIED QMS</text>
